apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  labels:
    app.kubernetes.io/name: external-secrets-operator
  name: cluster
spec:
  controllerConfig:
    networkPolicies:
    - name: allow-vault-access
      componentName: ExternalSecretsCoreController
      egress:
      - to: []  # Allow egress to any destination
        ports:
        - protocol: TCP
          port: 443   # HTTPS port for route access
        - protocol: TCP
          port: 80    # HTTP port for route access
      - to: []  # DNS resolution for route hostnames
        ports:
        - protocol: UDP
          port: 53    # DNS
        - protocol: TCP
          port: 53    # DNS over TCP
